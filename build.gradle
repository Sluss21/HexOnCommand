import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
	id 'fabric-loom' version '1.13-SNAPSHOT'
	id 'maven-publish'
	id "org.jetbrains.kotlin.jvm" version "2.3.10"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Mojang/Fabric
	maven { url = "https://maven.fabricmc.net" }
	mavenCentral()

	// Fabric ecosystem libs
	maven { url = "https://maven.terraformersmc.com/" }
	maven { url = "https://maven.shedaniel.me/" }
	maven { url = "https://maven.ladysnake.org/releases" }

	// Hex Casting + related
	maven { url = "https://maven.hexxy.media" }
	maven { url = "https://mvn.devos.one/snapshots/" }
	maven { url = "https://maven.blamejared.com/" }
	maven { url = "https://jitpack.io" }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"hexoncommand" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modImplementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"

	// ✅ FORCE LOCAL JARS (NO MAVEN LOOKUP)
	modImplementation files(
			"libs/hexcasting-fabric-1.21.1-0.12.0-devel-pre-16.jar",
			"libs/cardinal-components-api-6.1.3.jar",
			"libs/cloth-config-15.0.140-fabric.jar",
			"libs/inline-fabric-1.21.1-1.2.2.jar",
			"libs/paucal-0.7.1-pre-27+1.21.1-fabric.jar"
	)
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

kotlin {
	compilerOptions {
		jvmTarget = JvmTarget.JVM_17
	}
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}